syntax = "proto3";

package therapist;

option go_package = "therapist/pkg/proto/therapistpb;therapistpb";

// ─────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────

service TherapistService {
  // ── Therapist auth / onboarding ───────────────────────────────────────────
  // Called after Supabase auth. Upserts the therapist and returns their state + tokens.
  rpc AuthCallback (AuthCallbackRequest) returns (AuthCallbackResponse);

  // Returns the current state for an already-authenticated therapist.
  rpc GetStatus (GetStatusRequest) returns (GetStatusResponse);

  // Saves the full onboarding form (sets status = pending).
  rpc CompleteOnboarding (CompleteOnboardingRequest) returns (CompleteOnboardingResponse);

  // Admin: approve a therapist (generates referral ID, sets status = verified).
  rpc ApproveTherapist (ApproveTherapistRequest) returns (ApproveTherapistResponse);

  // Admin: reject a therapist with an optional reason.
  rpc RejectTherapist (RejectTherapistRequest) returns (RejectTherapistResponse);

  // Upload a file (profile photo, degree certificate, government ID).
  // Returns a URL string. Max 3 MB enforced server-side.
  rpc UploadFile (UploadFileRequest) returns (UploadFileResponse);

  // Exchange a valid refresh token for a new access + refresh token pair.
  rpc RefreshSession (RefreshSessionRequest) returns (RefreshSessionResponse);

  // Invalidate the refresh token (log out this device).
  rpc Logout (LogoutRequest) returns (LogoutResponse);

  // ── User (client/patient) auth / onboarding ───────────────────────────────
  // Called after Supabase auth for users (clients looking for a therapist).
  rpc UserAuthCallback (UserAuthCallbackRequest) returns (UserAuthCallbackResponse);

  // Saves the user onboarding form.
  rpc CompleteUserOnboarding (CompleteUserOnboardingRequest) returns (CompleteUserOnboardingResponse);

  // Fetch the authenticated user's own profile.
  rpc GetUserProfile (GetUserProfileRequest) returns (GetUserProfileResponse);

  // Exchange a user refresh token for a new access + refresh token pair.
  rpc UserRefreshSession (UserRefreshSessionRequest) returns (UserRefreshSessionResponse);

  // Invalidate the user refresh token (log out this device).
  rpc UserLogout (UserLogoutRequest) returns (UserLogoutResponse);

  // ── Discovery (user-facing) ───────────────────────────────────────────────
  // Full-text search across verified therapists.
  rpc SearchTherapists (SearchTherapistsRequest) returns (SearchTherapistsResponse);
  // Location + rating-based recommendations for a user.
  rpc GetRecommendedTherapists (GetRecommendedTherapistsRequest) returns (GetRecommendedTherapistsResponse);

  // ── Blog ──────────────────────────────────────────────────────────────────
  // Create a draft blog (verified therapists only).
  rpc CreateBlog (CreateBlogRequest) returns (CreateBlogResponse);
  // Update a draft blog (owner only).
  rpc UpdateBlog (UpdateBlogRequest) returns (UpdateBlogResponse);
  // Publish a draft blog (owner only).
  rpc PublishBlog (PublishBlogRequest) returns (PublishBlogResponse);
  // Delete a blog (owner only).
  rpc DeleteBlog (DeleteBlogRequest) returns (DeleteBlogResponse);
  // Fetch a single blog; increments view count for published blogs.
  rpc GetBlog (GetBlogRequest) returns (GetBlogResponse);
  // List published blogs (optionally filtered by therapist).
  rpc ListBlogs   (ListBlogsRequest)   returns (ListBlogsResponse);
  // List all blogs (draft + published) for the authenticated therapist.
  rpc ListMyBlogs (ListMyBlogsRequest) returns (ListMyBlogsResponse);
  // Toggle like on a published blog.
  rpc ToggleLikeBlog (ToggleLikeBlogRequest) returns (ToggleLikeBlogResponse);
  // Upload a single inline blog image (max 2 MB).
  rpc UploadBlogImage (UploadBlogImageRequest) returns (UploadBlogImageResponse);
}

// ─────────────────────────────────────────────
// AuthCallback
// ─────────────────────────────────────────────

message AuthCallbackRequest {
  string supabase_token = 1;
}

message AuthCallbackResponse {
  string therapist_id          = 1;
  // "needs_onboarding" | "pending" | "verified" | "rejected"
  string status                = 2;
  bool   onboarding_completed  = 3;
  string referral_id           = 4;
  string rejection_reason      = 5;
  // Session tokens
  string access_token          = 6;
  string refresh_token         = 7;
  int64  expires_at            = 8; // Unix timestamp — access token expiry
}

// ─────────────────────────────────────────────
// GetStatus
// ─────────────────────────────────────────────

message GetStatusRequest {
  string supabase_token = 1;
}

message GetStatusResponse {
  string therapist_id          = 1;
  string status                = 2;
  bool   onboarding_completed  = 3;
  string referral_id           = 4;
  string rejection_reason      = 5;
}

// ─────────────────────────────────────────────
// CompleteOnboarding
// ─────────────────────────────────────────────

message CompleteOnboardingRequest {
  string            therapist_id        = 1;

  // Required
  string            full_name           = 2;
  repeated string   languages_spoken    = 3;
  repeated string   specializations     = 4;
  int32             years_of_experience = 5;
  string            session_fee         = 6; // decimal string e.g. "1500.00"
  repeated string   session_types       = 7; // "video" | "in_person"
  string            degree_certificate  = 8;
  string            registration_number = 9;
  string            issuing_body        = 10;

  // Optional
  string            gender              = 11;
  string            bio                 = 12;
  string            profile_photo       = 13;
  string            phone_number        = 14;
  string            government_id       = 15;

  // Required when session_types contains "in_person"
  string            address_text        = 16;
  double            latitude            = 17;
  double            longitude           = 18;
  string            place_id            = 19;
  string            address_state       = 20; // e.g. "Maharashtra"
  string            address_nation      = 21; // e.g. "India"
}

message CompleteOnboardingResponse {
  bool success = 1;
}

// ─────────────────────────────────────────────
// Admin: Approve / Reject
// ─────────────────────────────────────────────

message ApproveTherapistRequest {
  string therapist_id = 1;
}

message ApproveTherapistResponse {
  string referral_id = 1;
}

message RejectTherapistRequest {
  string therapist_id = 1;
  string reason       = 2;
}

message RejectTherapistResponse {
  bool success = 1;
}

// ─────────────────────────────────────────────
// UploadFile
// ─────────────────────────────────────────────

message UploadFileRequest {
  bytes  data      = 1; // raw file bytes (max 3 MB)
  string file_name = 2;
  // "profile_photo" | "degree_certificate" | "government_id"
  string file_type = 3;
}

message UploadFileResponse {
  string url = 1; // storage URL (stub for now)
}

// ─────────────────────────────────────────────
// RefreshSession
// ─────────────────────────────────────────────

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RefreshSessionResponse {
  string therapist_id   = 1;
  string status         = 2;
  string access_token   = 3;
  string refresh_token  = 4;
  int64  expires_at     = 5;
}

// ─────────────────────────────────────────────
// Logout
// ─────────────────────────────────────────────

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

// ─────────────────────────────────────────────
// Blog
// ─────────────────────────────────────────────

enum BlogStatus {
  BLOG_STATUS_UNSPECIFIED = 0;
  BLOG_STATUS_DRAFT       = 1;
  BLOG_STATUS_PUBLISHED   = 2;
}

message Blog {
  string     id              = 1;
  string     therapist_id    = 2;
  string     title           = 3;
  string     slug            = 4;
  string     cover_image_url = 5;
  string     content         = 6;  // plain text / markdown, max 50 000 chars
  repeated string image_urls = 7;  // max 2 inline images
  BlogStatus status          = 8;
  int64      views           = 9;
  int64      likes           = 10;
  bool       liked_by_me     = 11;
  string     created_at      = 12;
  string     updated_at      = 13;
  string     published_at    = 14;
  repeated string tags       = 15; // e.g. ["anxiety","depression","stress"]
}

// CreateBlog — verified therapists only; creates a draft.
message CreateBlogRequest {
  string          therapist_id    = 1;
  string          title           = 2;
  string          content         = 3;
  string          cover_image_url = 4;
  repeated string image_urls      = 5;
  repeated string tags            = 6; // optional topic tags
}
message CreateBlogResponse { Blog blog = 1; }

// UpdateBlog — own draft only.
message UpdateBlogRequest {
  string          therapist_id    = 1;
  string          blog_id         = 2;
  string          title           = 3;
  string          content         = 4;
  string          cover_image_url = 5;
  repeated string image_urls      = 6;
  repeated string tags            = 7; // optional topic tags
}
message UpdateBlogResponse { Blog blog = 1; }

// PublishBlog — move draft → published.
message PublishBlogRequest {
  string therapist_id = 1;
  string blog_id      = 2;
}
message PublishBlogResponse { Blog blog = 1; }

// DeleteBlog — own blog (any status).
message DeleteBlogRequest {
  string therapist_id = 1;
  string blog_id      = 2;
}
message DeleteBlogResponse { bool success = 1; }

// GetBlog — fetch one blog; increments views when published.
message GetBlogRequest {
  string blog_id      = 1;
  string viewer_id    = 2; // optional — therapist_id of the viewer, used for liked_by_me
}
message GetBlogResponse { Blog blog = 1; }

// ListBlogs — paginated list of published blogs (optionally filtered by therapist).
message ListBlogsRequest {
  string therapist_id = 1; // optional filter
  string viewer_id    = 2; // optional — for liked_by_me
  int32  page         = 3; // 1-based
  int32  page_size    = 4; // max 50
}
message ListBlogsResponse {
  repeated Blog blogs = 1;
  int32         total = 2;
}

// ListMyBlogs — all blogs (draft + published) for the authenticated therapist.
message ListMyBlogsRequest {
  string therapist_id = 1;
  int32  page         = 2; // 1-based
  int32  page_size    = 3; // max 50
}
message ListMyBlogsResponse {
  repeated Blog blogs = 1;
  int32         total = 2;
}

// ToggleLikeBlog — like or unlike a published blog.
message ToggleLikeBlogRequest {
  string therapist_id = 1; // the liker
  string blog_id      = 2;
}
message ToggleLikeBlogResponse {
  bool  liked = 1;
  int64 likes = 2;
}

// UploadBlogImage — upload one inline blog image (max 2 MB).
message UploadBlogImageRequest {
  string therapist_id  = 1;
  bytes  data          = 2;
  string file_name     = 3;
  string content_type  = 4; // image/jpeg | image/png | image/webp
}
message UploadBlogImageResponse { string url = 1; }

// ─────────────────────────────────────────────
// User (client/patient)
// ─────────────────────────────────────────────

message User {
  string          id                   = 1;
  string          email                = 2;
  string          name                 = 3;
  string          phone                = 4;
  string          state                = 5;
  string          nation               = 6;
  repeated string looking_for          = 7;
  bool            onboarding_completed = 8;
  string          created_at           = 9;
}

// UserAuthCallback
message UserAuthCallbackRequest {
  string supabase_token = 1;
}
message UserAuthCallbackResponse {
  string user_id               = 1;
  // "needs_onboarding" | "active"
  string status                = 2;
  bool   onboarding_completed  = 3;
  string access_token          = 4;
  string refresh_token         = 5;
  int64  expires_at            = 6; // Unix timestamp
}

// CompleteUserOnboarding
message CompleteUserOnboardingRequest {
  string          user_id     = 1;
  string          name        = 2;  // required
  string          phone       = 3;  // optional
  string          state       = 4;  // e.g. "Maharashtra"
  string          nation      = 5;  // e.g. "India"
  repeated string looking_for = 6;  // e.g. ["Anxiety", "Depression"]
}
message CompleteUserOnboardingResponse {
  bool success = 1;
}

// GetUserProfile
message GetUserProfileRequest {
  string user_id = 1;
}
message GetUserProfileResponse {
  User user = 1;
}

// UserRefreshSession
message UserRefreshSessionRequest {
  string refresh_token = 1;
}
message UserRefreshSessionResponse {
  string user_id        = 1;
  string status         = 2;
  string access_token   = 3;
  string refresh_token  = 4;
  int64  expires_at     = 5;
}

// UserLogout
message UserLogoutRequest {
  string refresh_token = 1;
}
message UserLogoutResponse {
  bool success = 1;
}

// ─────────────────────────────────────────────
// Discovery
// ─────────────────────────────────────────────

message TherapistCard {
  string          therapist_id     = 1;
  string          full_name        = 2;
  string          bio              = 3;
  string          profile_photo    = 4;
  repeated string specializations  = 5;
  double          session_fee      = 6;
  repeated string session_types    = 7;  // "video" | "in_person"
  double          rating           = 8;
  int32           total_sessions   = 9;
  string          state            = 10;
  string          nation           = 11;
  string          address_text     = 12;
}

// SearchTherapists
message SearchTherapistsRequest {
  string query        = 1;  // searched in name / bio / specializations
  string session_type = 2;  // optional: "video" | "in_person"
  int32  page         = 3;
  int32  page_size    = 4;
}
message SearchTherapistsResponse {
  repeated TherapistCard therapists = 1;
  int64                  total      = 2;
}

// GetRecommendedTherapists
message GetRecommendedTherapistsRequest {
  string state     = 1;  // user's state — used for location scoring
  string nation    = 2;  // user's nation
  int32  page      = 3;
  int32  page_size = 4;
}
message GetRecommendedTherapistsResponse {
  repeated TherapistCard therapists = 1;
}
