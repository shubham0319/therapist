version: '3.9'

# Starts local Redis only.
# Postgres is hosted on Supabase — no local DB container needed.

services:
  redis:
    image: redis:7-alpine
    container_name: therapist_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
